name: GS 3DGS Intelligence CI

on:
  push:
    paths:
      - "automation/gs-3dgs-intelligence/**"
      - ".github/workflows/gs-3dgs-intelligence-ci.yml"
      - ".github/workflows/gs-3dgs-daily.yml"
  pull_request:
    paths:
      - "automation/gs-3dgs-intelligence/**"
      - ".github/workflows/gs-3dgs-intelligence-ci.yml"
      - ".github/workflows/gs-3dgs-daily.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run GS intelligence unit tests
        run: >-
          python -m unittest discover
          -s automation/gs-3dgs-intelligence/test
          -p "test_*.py"
          -v
